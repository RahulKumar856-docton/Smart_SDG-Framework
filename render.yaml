services:
  # Option 1: Unified Full-Stack Web Service (Flask API + React Frontend SPA on one URL)
  - type: web
    name: smart-sdg-framework
    env: python
    buildCommand: bash build.sh
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.18.0
      - key: SECRET_KEY
        generateValue: true

  # Option 2: Dedicated Static Site (Render CDN hosting for React SPA)
  - type: web
    name: smart-sdg-frontend
    runtime: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0

